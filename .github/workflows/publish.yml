name: Publish

# To publish a version, admins run on an up-to-date `main`:
#   npm version <version>
#   git push --atomic --follow-tags origin main
#
# `npm version` commits the new version and tags it,
# and the push updates `main` and the tag together, which runs this workflow.
on:
  push:
    tags:
      - 'v*'

permissions: {}

cache-mode: none

env:
  FORCE_COLOR: 1

# never run two publishes at once, and never cancel one midway
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # dependencies only run in this read-only job, so they cannot mint an npm publishing token
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read # check out the repository

    steps:
      # the full history includes `main`, to check that the tag is on it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          run-install: false

      # fails early, before `vp run ci`
      - name: Check version
        run: |
          VERSION=$(jq --raw-output .version package.json)
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION in package.json"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi
          if npm view "react-data-grid@$VERSION" version > /dev/null 2>&1; then
            echo "::error::Version $VERSION is already published to npm"
            exit 1
          fi

      - run: vp install --frozen-lockfile

      - run: vp run ci
        timeout-minutes: 6

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lib
          path: lib/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          run-install: false
          registry-url: 'https://registry.npmjs.org'

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lib
          path: lib

      # https://docs.npmjs.com/trusted-publishers
      # `--ignore-scripts` skips the `prepare` script, so no project code runs either
      - name: Publish to npm
        run: npm publish --tag latest --ignore-scripts

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
